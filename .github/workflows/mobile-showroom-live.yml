name: Mobile showroom prototype cleanup audit
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/ttc-integration.js'
      - 'tests/mobile-showroom-live.mjs'
      - '.github/workflows/mobile-showroom-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install chromium
      - run: node tests/mobile-showroom-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-showroom-screenshots
          path: artifacts/mobile-showroom/*.png
