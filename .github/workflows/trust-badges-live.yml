name: Live trust badges and Philippine Made responsive audit
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/trust-center.js'
      - 'public/trust-center.css'
      - 'src/portal.ts'
      - 'tests/trust-badges-live.mjs'
      - '.github/workflows/trust-badges-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install chromium
      - name: Verify live badge API, origin mark, filters and mobile layout
        run: node tests/trust-badges-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-badges-responsive-screenshots
          path: artifacts/trust/*.png
