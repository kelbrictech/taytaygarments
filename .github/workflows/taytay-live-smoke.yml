name: Live Taytaygarments smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taytay-live-smoke.yml'
      - 'wrangler.toml'
      - 'public/index.html'
      - 'public/privacy-controls.js'
      - 'public/typography.css'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    timeout-minutes: 3
    steps:
      - name: Wait for Cloudflare production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const commit = await github.rest.repos.getCommit({owner, repo, ref: context.sha});
            const needsDeployment = (commit.data.files || []).some(file =>
              file.filename.startsWith('public/') ||
              file.filename.startsWith('src/') ||
              file.filename === 'wrangler.toml'
            );
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data} = await github.rest.checks.listForRef({owner, repo, ref: context.sha, per_page: 100});
              const build = data.check_runs.find(check => check.name === 'Workers Builds: taytaygarments');
              if (build && build.status === 'completed') {
                if (build.conclusion !== 'success') {
                  core.setFailed('Cloudflare production build ended with ' + build.conclusion);
                } else {
                  core.info('Cloudflare production build completed: ' + (build.external_id || build.id));
                }
                return;
              }
              if (!build && !needsDeployment) {
                core.info('No production files changed; testing the current deployed Worker.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for the Cloudflare production deployment check.');
      - name: Inspect Cloudflare public website and API
        env:
          ORIGIN: https://taytaygarments.kelbrictech.workers.dev
        run: |
          set -euo pipefail
          for route in / /typography.css /api/health /api/v1/products; do
            echo "::group::GET $route"
            status=$(curl -L --retry 3 --retry-all-errors --connect-timeout 8 --max-time 20 -sS -o response.txt -w '%{http_code}' "$ORIGIN$route")
            echo "HTTP status: $status"
            echo "Response bytes: $(wc -c < response.txt)"
            if [[ "$route" == "/api/health" || "$route" == "/api/v1/products" ]]; then head -c 1000 response.txt; echo; fi
            if [[ "$route" == "/" ]]; then
              test "$status" = "200"
              grep -qi "taytay textile" response.txt
              grep -q 'href="/typography.css"' response.txt
            fi
            if [[ "$route" == "/typography.css" ]]; then
              test "$status" = "200"
              grep -q -- "--type-editorial" response.txt
              grep -q -- "--type-interface" response.txt
            fi
            if [[ "$route" == "/api/health" ]]; then
              test "$status" = "200"
              grep -q '"databaseConfigured"' response.txt
            fi
            echo "::endgroup::"
          done
