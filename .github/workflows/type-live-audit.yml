name: Independent live typography audit
on:
  push:
    branches: [audit/live-font-hierarchy-20261026]
    paths:
      - '.github/workflows/type-live-audit.yml'
      - 'audit/live-type.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Audit ACTUAL Cloudflare live site, multiple routes and widths
        run: node audit/live-type.mjs
