name: Showroom asset pipeline validation
on:
  push:
    branches: [assets/showroom-asset-pipeline-v1]
    paths:
      - 'catalog/**'
      - 'tools/validate_showroom_assets.py'
      - 'tests/test_asset_gate.py'
      - '.github/workflows/asset-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tests -p 'test_asset_gate.py' -v
