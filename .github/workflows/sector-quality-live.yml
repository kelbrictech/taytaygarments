name: Sector photography and responsive quality audit
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/sector-visual-refresh.css'
      - 'tests/sector-quality-live.mjs'
      - '.github/workflows/sector-quality-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install chromium
      - run: node tests/sector-quality-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-photo-responsive-screenshots
          path: artifacts/sector-quality/*.png
