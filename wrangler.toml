name = "taytaygarments"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[vars]
SITE_STATUS = "development"
INQUIRIES_ENABLED = "false"
SITE_NAME = "Taytay Textile Co."
# New client deployments can define CLIENT_CONFIG_JSON from clients/example-apparel.json.
# Keep each deployment's Worker, domain, database and secrets independent.
# Never use this production Worker to preview another client.
# Put DATABASE_URL, ADMIN_API_TOKEN, IP_HASH_PEPPER in Cloudflare secrets, never in Git.
